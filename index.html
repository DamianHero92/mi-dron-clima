<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mavic Air 1 Fly Status</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --text-main: #ffffff;
            --text-muted: #808a9d;
            --safe: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid #2e374a;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .status-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 2px solid transparent;
        }
        .status-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        .status-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        .metric-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .btn-update {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .btn-update:active {
            background-color: #1d4ed8;
        }
        .safe-border { border-color: var(--safe); }
        .danger-border { border-color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Mavic Air 1 Fly Status</h1>
            <p>Radar de Vuelo Mundial Autónomo</p>
        </div>

        <div class="search-box">
            <input type="text" id="ciudadInput" class="search-input" value="Cabo San Lucas" placeholder="Escribe una ciudad...">
            <button class="btn-update" onclick="buscarCiudadGeocoding()">Buscar</button>
        </div>

        <div id="statusCard" class="status-card">
            <div id="statusIcon" class="status-icon">🌍</div>
            <div id="statusTitle" class="status-title">Radar Listo</div>
            <div id="statusDesc" class="status-desc">Escribe la ciudad a la que viajas y presiona "Buscar" para descargar el clima satelital en vivo.</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Viento</div>
                <div id="windValue" class="metric-value">-- km/h</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Lluvia</div>
                <div id="rainValue" class="metric-value">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Temperatura</div>
                <div id="tempValue" class="metric-value">-- °C</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Estado Cielo</div>
                <div id="skyValue" class="metric-value">--</div>
            </div>
        </div>
    </div>

    <script>
        window.recibirDatosClimaSatelital = function(datos) {
            const actual = datos.current;
            const viento = Math.round(actual.wind_speed_10m); 
            const lluvia = actual.precipitation; 
            const temp = Math.round(actual.temperature_2m);
            const codigoCielo = actual.weather_code;

            document.getElementById('windValue').innerText = `${viento} km/h`;
            document.getElementById('rainValue').innerText = lluvia > 0 ? `${lluvia} mm` : `0%`;
            document.getElementById('tempValue').innerText = `${temp} °C`;
            
            let estadoCielo = "Despejado";
            if(codigoCielo >= 1 && codigoCielo <= 3) estadoCielo = "Nublado";
            if(codigoCielo >= 45 && codigoCielo <= 48) estadoCielo = "Niebla";
            if(codigoCielo >= 51 && codigoCielo <= 67) estadoCielo = "Lluvia";
            if(codigoCielo >= 80) estadoCielo = "Tormenta";
            document.getElementById('skyValue').innerText = estadoCielo;

            const card = document.getElementById('statusCard');
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const desc = document.getElementById('statusDesc');

            if (viento < 28 && lluvia === 0 && codigoCielo < 51) {
                card.className = "status-card safe-border";
                icon.innerText = "✅";
                title.innerText = "¡Listo para Volar!";
                title.style.color = "var(--safe)";
                desc.innerText = `Las condiciones en esta zona son excelentes para tu Mavic Air 1. El viento está a ${viento} km/h.`;
            } else {
                card.className = "status-card danger-border";
                icon.innerText = "❌";
                title.innerText = "No Volar";
                title.style.color = "var(--danger)";
                
                let riesgos = [];
                if(viento >= 28) riesgos.push(`vientos de ${viento} km/h`);
                if(lluvia > 0 || codigoCielo >= 51) riesgos.push(`lluvia o tormenta`);
                
                desc.innerText = `Riesgo detectado para tu dron en este punto debido a: ${riesgos.join(' y ')}. Evita despegar.`;
            }
        };

        window.recibirCoordenadasBuscador = function(resultado) {
            const card = document.getElementById('statusCard');
            
            if (!resultado.results || resultado.results.length === 0) {
                card.className = "status-card danger-border";
                document.getElementById('statusIcon').innerText = "❓";
                document.getElementById('statusTitle').innerText = "No Encontrada";
                document.getElementById('statusDesc').innerText = "No pudimos localizar esa ciudad. Revisa cómo está escrita e intenta de nuevo.";
                return;
            }

            // CORRECCIÓN AQUÍ: Tomamos el primer elemento [0] de la lista devuelta por el buscador
            const localizacion = resultado.results[0];
            const lat = localizacion.latitude;
            const lon = localizacion.longitude;
            const nombreCompleto = `${localizacion.name}, ${localizacion.country}`;

            document.getElementById('statusDesc').innerText = `Sincronizando satélites meteorológicos para: ${nombreCompleto}...`;

            const scriptClima = document.createElement('script');
            scriptClima.src = `https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code,wind_speed_10m&jsonp=recibirDatosClimaSatelital&nocache=${Date.now()}`;
            document.body.appendChild(scriptClima);
        };

        function buscarCiudadGeocoding() {
            const ciudad = document.getElementById('ciudadInput').value.trim();
            if (!ciudad) return;

            document.getElementById('statusTitle').innerText = "Buscando...";
            document.getElementById('statusIcon').innerText = "🛰️";
            document.getElementById('statusDesc').innerText = `Rastreando coordenadas globales de "${ciudad}"...`;

            const scriptViejo = document.getElementById('scriptGeocoding');
            if (scriptViejo) scriptViejo.remove();

            const script = document.createElement('script');
            script.id = 'scriptGeocoding';
            script.src = `https://open-meteo.com{encodeURIComponent(ciudad)}&count=1&language=es&jsonp=recibirCoordenadasBuscador`;
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
