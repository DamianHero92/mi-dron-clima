<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mavic Air 1 Fly Status</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --text-main: #ffffff;
            --text-muted: #808a9d;
            --safe: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }
        .status-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 2px solid transparent;
        }
        .status-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        .status-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .metric-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        .metric-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .safe-border { border-color: var(--safe); }
        .danger-border { border-color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Mavic Air 1 Fly Status</h1>
            <p>Cabo San Lucas — Monitoreo en Vivo</p>
        </div>

        <!-- Pantalla configurada para las condiciones seguras evaluadas -->
        <div id="statusCard" class="status-card safe-border">
            <div id="statusIcon" class="status-icon">✅</div>
            <div id="statusTitle" class="status-title" style="color: var(--safe);">¡Listo para Volar!</div>
            <div id="statusDesc" class="status-desc">Las condiciones actuales en Cabo San Lucas son óptimas para tu aeronave. El viento se mantiene suave y el cielo está despejado.</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Viento</div>
                <div id="windValue" class="metric-value">13 km/h</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Lluvia</div>
                <div id="rainValue" class="metric-value">0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Temperatura</div>
                <div id="tempValue" class="metric-value">26 °C</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Estado Cielo</div>
                <div id="skyValue" class="metric-value">Despejado</div>
            </div>
        </div>
    </div>

</body>
</html>
